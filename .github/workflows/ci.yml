name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3", "8.5"]
    steps:
      - uses: actions/checkout@v7
        with: { path: camada-php }
      # The suite reads golden fixtures from camada-core and pins camada-browser to the vendored release tag.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-core
          path: camada-core
      - id: beacon
        run: |
          v=$(sed -n "s/^[[:space:]]*public const VERSION = '\([^']*\)';$/\1/p" camada-php/src/BeaconJs.php)
          [ -n "$v" ] || { echo "::error::no vendored beacon version in camada-php/src/BeaconJs.php"; exit 1; }
          echo "ref=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-browser
          ref: ${{ steps.beacon.outputs.ref }}
          path: camada-browser
      - uses: actions/setup-node@v7
        with: { node-version: 22.x }
      - run: npm install && npm run build
        working-directory: camada-browser
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "json, zlib"
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: camada-php
      - run: composer lint
        working-directory: camada-php
      - run: composer fmt
        working-directory: camada-php
      - run: composer test
        working-directory: camada-php
