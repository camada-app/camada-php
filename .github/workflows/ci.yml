name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3", "8.5"]
    steps:
      - uses: actions/checkout@v7
        with: { path: camada-php }
      # The golden snapshot fixtures the suite is pinned to, and the beacon build the package vendors.
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-core
          path: camada-core
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/camada-browser
          path: camada-browser
      - uses: actions/setup-node@v7
        with: { node-version: 22.x }
      - run: npm install && npm run build
        working-directory: camada-browser
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "json, zlib"
          coverage: none
      - run: composer install --no-interaction --no-progress
        working-directory: camada-php
      - run: composer lint
        working-directory: camada-php
      - run: composer fmt
        working-directory: camada-php
      - run: composer test
        working-directory: camada-php
